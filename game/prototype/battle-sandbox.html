<title>Battle Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen battle map. Canvas fills the screen; a slim status bar sits on top, the command bar at the bottom.
   Colour: slate field, brass accent for controls, blue for the player, red for the enemy. */
:root {
  --ground: #8d9479;
  --hill: #a1a88b;
  --forest: #4f6b4a;
  --water: #6f8da0;
  --ink: #1d2318;
  --panel: #f1efe6;
  --panel-ink: #1d2318;
  --line: #c9c5b3;
  --accent: #8a5a12;
  --accent-ink: #fff8ea;
  --you-h: 215;
  --foe: #b8392b;
  --muted: #5d6350;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #3b4234;
    --hill: #4a5240;
    --forest: #2b3f2b;
    --water: #33495a;
    --ink: #e8e6d8;
    --panel: #1c2118;
    --panel-ink: #e8e6d8;
    --line: #3a4132;
    --accent: #d8a24a;
    --accent-ink: #1c1608;
    --foe: #e0614f;
    --muted: #a7ad98;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #3b4234;
  --hill: #4a5240;
  --forest: #2b3f2b;
  --water: #33495a;
  --ink: #e8e6d8;
  --panel: #1c2118;
  --panel-ink: #e8e6d8;
  --line: #3a4132;
  --accent: #d8a24a;
  --accent-ink: #1c1608;
  --foe: #e0614f;
  --muted: #a7ad98;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; overflow: hidden; }
body { background: var(--ground); color: var(--panel-ink); font-family: var(--font-body); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }
#stage { position: relative; flex: 1 1 auto; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.bar { background: var(--panel); border-color: var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-block: 8px; border-bottom: 1px solid var(--line); padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
#top h1 { margin: 0; font: 700 16px/1.1 var(--font-display); letter-spacing: .02em; }
.stat { font: 500 12px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stat b { color: var(--panel-ink); font-weight: 500; }
.you { color: hsl(var(--you-h) 70% 45%); }
.foe { color: var(--foe); }
.spacer { flex: 1 1 0; }
button, select, input { font: 500 13px var(--font-body); }
button { background: transparent; color: var(--panel-ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#bottom { border-top: 1px solid var(--line); padding-block: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
#log { font: 400 12px/1.4 var(--font-mono); color: var(--muted); min-height: 2.8em; max-height: 4.2em; overflow: hidden; }
#log div:last-child { color: var(--panel-ink); }
#cmd { display: flex; gap: 8px; }
#cmd input { flex: 1 1 0; min-width: 0; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--panel-ink); }
#cmd button.go { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#quick { display: flex; flex-wrap: wrap; gap: 6px; }
#quick .grp { display: flex; flex-wrap: wrap; gap: 6px; }
#more summary { font: 500 12px var(--font-mono); color: var(--muted); cursor: pointer; padding: 2px 0; }
#opts { padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
#opts label { font: 400 12px var(--font-mono); color: var(--muted); display: flex; align-items: center; gap: 4px; }
#banner { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--panel) 70%, transparent); text-align: center; padding: 24px; }
#banner.show { display: flex; }
#banner h2 { margin: 0 0 6px; font: 700 28px var(--font-display); }
#banner p { margin: 0 0 14px; font: 400 13px var(--font-mono); color: var(--muted); }
#hint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 8px; font: 400 11px/1.4 var(--font-mono); color: var(--ink); opacity: .75; pointer-events: none; max-width: 70%; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <div id="top" class="bar">
    <h1>Battle Sandbox</h1>
    <span class="stat">t <b id="sT">0</b>s</span>
    <span class="stat you">you <b id="sY">0</b></span>
    <span class="stat foe">foe <b id="sF">0</b></span>
    <span class="stat"><b id="sFps">0</b> fps · <b id="sMs">0</b> ms/step</span>
    <span class="spacer"></span>
    <span role="group" aria-label="Speed">
      <button data-sp="1" aria-pressed="true">1×</button>
      <button data-sp="2" aria-pressed="false">2×</button>
      <button data-sp="4" aria-pressed="false">4×</button>
    </span>
  </div>
  <div id="stage">
    <canvas id="cv" aria-label="Battlefield"></canvas>
    <div id="hint">One finger drags the map. Two fingers swipe to order the army that way. Pinch to zoom.</div>
    <div id="banner"><div><h2 id="bT"></h2><p id="bP"></p><button id="bRe" class="go">New battle</button></div></div>
  </div>
  <div id="bottom" class="bar">
    <div id="log" aria-live="polite"></div>
    <form id="cmd" autocomplete="off">
      <input id="cmdIn" type="text" placeholder='Try "left wing advance, hold the centre" or "hide the cavalry in the trees"' aria-label="Command">
      <button class="go" type="submit">Send</button>
    </form>
    <div id="quick">
      <span class="grp" id="grpBtns"></span>
      <span class="grp" id="actBtns"></span>
    </div>
    <details id="more"><summary>Options</summary>
    <div id="opts">
      <label>Dots per side
        <select id="optN"><option>600</option><option selected>1200</option><option>2500</option><option>5000</option></select>
      </label>
      <label>Seed <input id="optSeed" type="number" value="7" style="width:64px"></label>
      <button id="optReset">Reset</button>
      <label><input id="optDebug" type="checkbox"> Show pending orders (debug)</label>
      <label><input id="optHide" type="checkbox" checked> Enemy hidden in trees</label>
    </div>
    </details>
  </div>
</div>

<script>
(() => {
'use strict';

/* ================= Simulation (code only, deterministic, no UI) ================= */
const W = 2400, H = 1600, DT = 1 / 30, CELL = 3;
const GX = Math.ceil(W / CELL), GY = Math.ceil(H / CELL);
const CC = 30, CGX = Math.ceil(W / CC), CGY = Math.ceil(H / CC);
const SOL = 0, SPEAR = 1, CAV = 2, ARCH = 3, CAT = 4;
const SPEED = [3.0, 2.7, 8.5, 3.0, 1.0];
const ORDER_DELAY = 20;           // battle seconds, fixed and hidden (spec 6.6)
const K = 0.10, S_EXP = 1.2, B_SUP = 0.25, T_TRAIN = 0.08; // death formula constants (spec 6.4)
const MELEE = 3.2, MELEE2 = MELEE * MELEE;

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function defaultObstacles() {
  return [
    { kind: 'hill', x: 1200, y: 480, r: 170 },
    { kind: 'hill', x: 1120, y: 1150, r: 190 },
    { kind: 'forest', x: 1850, y: 300, r: 130 },
    { kind: 'forest', x: 700, y: 1350, r: 130 },
    { kind: 'pond', x: 1250, y: 820, r: 70 },
  ];
}

// group definition: {team,key,name,train,count,cx,cy,w,h,mix:[spearFrac,cavFrac,archFrac,catFrac]}
function defaultGroups(perSide) {
  const frac = { L: .20, C: .26, R: .20, V: .12, A: .16, K: .06 };
  const names = { L: 'Left wing', C: 'Centre', R: 'Right wing', V: 'Cavalry', A: 'Archers', K: 'Catapults' };
  const trainYou = { L: 3, C: 5, R: 1, V: 7, A: 4, K: 1 };
  const trainFoe = { L: 2, C: 6, R: 2, V: 5, A: 3, K: 1 };
  const lay = { // team 0 layout, mirrored for team 1
    L: [380, 420, 140, 340], C: [380, 800, 140, 340], R: [380, 1180, 140, 340],
    V: [200, 220, 120, 140], A: [230, 640, 90, 220], K: [120, 800, 50, 130],
  };
  const layFoe = Object.assign({}, lay, { V: [1850, 300, 110, 110] }); // hidden reserve in the forest
  const out = [];
  for (const team of [0, 1]) {
    for (const k of ['L', 'C', 'R', 'V', 'A', 'K']) {
      let [cx, cy, w, h] = (team ? layFoe : lay)[k];
      if (team && k !== 'V') cx = W - cx;
      const count = Math.max(k === 'K' ? 3 : 8, Math.round(perSide * frac[k]));
      out.push({
        team, key: k, name: names[k], train: (team ? trainFoe : trainYou)[k], count, cx, cy, w, h,
        type: k === 'V' ? CAV : k === 'A' ? ARCH : k === 'K' ? CAT : -1,
      });
    }
  }
  return out;
}

class Sim {
  constructor(o = {}) {
    this.rng = mulberry32((o.seed | 0) || 1);
    this.t = 0; this.pass = 0; this.stepN = 0; this.over = null; this.aiLog = [];
    this.delay = o.delay == null ? ORDER_DELAY : o.delay;
    this.hideEnemy = o.hideEnemy !== false;
    this.obst = o.obstacles || defaultObstacles();
    const defs = o.groups || defaultGroups(o.perSide || 1200);
    this.defs = defs;
    let N = 0; for (const d of defs) N += d.count;
    this.N = N;
    this.x = new Float32Array(N); this.y = new Float32Array(N);
    this.vx = new Float32Array(N); this.vy = new Float32Array(N);
    this.ox = new Float32Array(N); this.oy = new Float32Array(N);
    this.team = new Uint8Array(N); this.type = new Uint8Array(N); this.grp = new Uint16Array(N);
    this.alive = new Uint8Array(N); this.hid = new Uint8Array(N); this.dtr = new Uint8Array(N);
    this.cool = new Float32Array(N); this.near = new Int32Array(N).fill(-1);
    this.head = new Int32Array(GX * GY); this.nxt = new Int32Array(N);
    this.chead = new Int32Array(CGX * CGY * 2); this.cnxt = new Int32Array(N);
    this.groups = []; this.orders = []; this.proj = [];
    this.start = [0, 0]; this.count = [0, 0];
    let id = 0;
    for (const d of defs) {
      const g = {
        id, team: d.team, key: d.key, name: d.name, train: d.train, dots: [], alive: 0,
        stance: 'hold', goal: { x: d.cx, y: d.cy }, morale: 0.85, fleeing: false,
        cx: d.cx, cy: d.cy, speed: 3, lossPass: 0, expSum: 0, expN: 0, visible: true, ranged: false, range: 0,
      };
      const cols = Math.max(1, Math.round(Math.sqrt(d.count * d.w / d.h)));
      const rows = Math.ceil(d.count / cols);
      const sx = d.w / cols, sy = d.h / rows;
      let minSp = 99;
      for (let n = 0; n < d.count; n++) {
        const i = this.groups.reduce((a, q) => a + q.dots.length, 0) + g.dots.length;
        const c = n % cols, r = Math.floor(n / cols);
        const px = d.cx - d.w / 2 + (c + 0.5) * sx + (this.rng() - 0.5) * sx * 0.5;
        const py = d.cy - d.h / 2 + (r + 0.5) * sy + (this.rng() - 0.5) * sy * 0.5;
        let ty = d.type >= 0 ? d.type : (this.rng() < 0.45 ? SPEAR : SOL);
        this.x[i] = px; this.y[i] = py; this.ox[i] = px - d.cx; this.oy[i] = py - d.cy;
        this.team[i] = d.team; this.type[i] = ty; this.grp[i] = id; this.alive[i] = 1; this.dtr[i] = d.train;
        this.cool[i] = this.rng() * 3;
        g.dots.push(i); minSp = Math.min(minSp, SPEED[ty]);
      }
      g.speed = minSp; g.alive = d.count;
      if (d.type === ARCH) { g.ranged = true; g.range = 140; }
      if (d.type === CAT) { g.ranged = true; g.range = 380; }
      this.start[d.team] += d.count; this.count[d.team] += d.count;
      this.groups.push(g); id++;
    }
    // fix global index: dots were pushed using running count above; rebuild safely
    this._reindex();
    this.nextAi = 0;
    this.rebuildGrid();
    this.updateHidden();
    this.updateGroups();
  }
  _reindex() { /* indices are assigned in creation order; verify */
    let i = 0;
    for (const g of this.groups) for (let k = 0; k < g.dots.length; k++) { g.dots[k] = i++; }
  }
  rebuildGrid() {
    this.head.fill(-1);
    const { x, y, alive, head, nxt, N } = this;
    for (let i = 0; i < N; i++) {
      if (!alive[i]) continue;
      const cx = clamp((x[i] / CELL) | 0, 0, GX - 1), cy = clamp((y[i] / CELL) | 0, 0, GY - 1);
      const c = cy * GX + cx; nxt[i] = head[c]; head[c] = i;
    }
  }
  nearestEnemyGroup(g, onlyVisible) {
    let best = null, bd = 1e12;
    for (const h of this.groups) {
      if (h.team === g.team || h.alive <= 0) continue;
      if (onlyVisible && g.team === 0 && this.hideEnemy && !h.visible) continue;
      const dx = h.cx - g.cx, dy = h.cy - g.cy, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = h; }
    }
    return best;
  }
  issue(team, keys, action, opt = {}) {
    const at = this.t + this.delay;
    this.orders.push({ at, team, keys, action, opt });
    this.orders.sort((a, b) => a.at - b.at);
  }
  exec(o) {
    for (const g of this.groups) {
      if (g.team !== o.team || g.alive <= 0) continue;
      if (o.keys !== 'all' && !o.keys.includes(g.key)) continue;
      if (o.opt.mood) g.morale = clamp(g.morale + 0.15 * o.opt.mood, 0, 1);
      if (g.fleeing) continue;
      const a = o.action;
      if (a === 'hold') { g.stance = 'hold'; g.goal = { x: g.cx, y: g.cy }; }
      else if (a === 'advance') { g.stance = g.ranged ? 'attack' : 'advance'; }
      else if (a === 'retreat') { g.stance = 'retreat'; g.goal = { x: o.team ? W - 90 : 90, y: g.cy }; }
      else if (a === 'move') {
        g.stance = 'move';
        g.goal = { x: clamp(g.cx + o.opt.dx * 450, 60, W - 60), y: clamp(g.cy + o.opt.dy * 450, 60, H - 60) };
      }
      else if (a === 'flank') {
        const e = this.nearestEnemyGroup(g, true);
        const sgn = g.cy < H / 2 ? -1 : 1;
        const ex = e ? e.cx : (o.team ? 300 : W - 300);
        g.stance = 'flank'; g.goal = { x: clamp(ex + (o.team ? 250 : -250), 60, W - 60), y: clamp(g.cy + sgn * 520, 60, H - 60) };
      }
      else if (a === 'conceal') {
        let best = null, bd = 1e12;
        for (const ob of this.obst) { if (ob.kind !== 'forest') continue; const d = (ob.x - g.cx) ** 2 + (ob.y - g.cy) ** 2; if (d < bd) { bd = d; best = ob; } }
        if (best) { g.stance = 'conceal'; g.goal = { x: best.x, y: best.y }; }
      }
      else if (a === 'hill') {
        let best = null, bd = 1e12;
        for (const ob of this.obst) { if (ob.kind !== 'hill') continue; const d = (ob.x - g.cx) ** 2 + (ob.y - g.cy) ** 2; if (d < bd) { bd = d; best = ob; } }
        if (best) { g.stance = 'move'; g.goal = { x: best.x - (o.team ? -best.r * .4 : best.r * .4), y: best.y }; }
      }
    }
  }
  terrain(px, py) {
    let m = 1;
    for (const ob of this.obst) {
      const dx = px - ob.x, dy = py - ob.y, d2 = dx * dx + dy * dy;
      if (d2 < ob.r * ob.r) { if (ob.kind === 'hill') m *= 0.75; else if (ob.kind === 'forest') m *= 0.85; }
    }
    return m;
  }
  updateGroups() {
    for (const g of this.groups) {
      let sx = 0, sy = 0, n = 0, vis = 0;
      for (const i of g.dots) if (this.alive[i]) { sx += this.x[i]; sy += this.y[i]; n++; if (!this.hid[i]) vis++; }
      g.alive = n;
      if (n > 0) { g.cx = sx / n; g.cy = sy / n; g.visible = vis > n * 0.5; }
    }
    for (const g of this.groups) {
      if (g.alive <= 0) continue;
      if (g.fleeing) { g.goal = { x: g.team ? W - 60 : 60, y: g.cy }; continue; }
      const e = this.nearestEnemyGroup(g, true);
      if (g.stance === 'advance') {
        g.goal = e ? { x: e.cx, y: e.cy } : { x: W / 2, y: g.cy };
      } else if (g.stance === 'attack') {
        if (e) {
          const dx = e.cx - g.cx, dy = e.cy - g.cy, d = Math.hypot(dx, dy) || 1;
          if (d > g.range * 0.7) g.goal = { x: e.cx - dx / d * g.range * 0.65, y: e.cy - dy / d * g.range * 0.65 };
          else g.goal = { x: g.cx, y: g.cy };
        } else g.goal = { x: W / 2, y: g.cy };
      } else if (g.stance === 'flank') {
        if (Math.hypot(g.goal.x - g.cx, g.goal.y - g.cy) < 90) g.stance = 'advance';
      }
    }
  }
  aiDecide() {
    // Stand-in for the model-driven enemy commander (spec 6.7): simple scripted plan, issued through the same order delay.
    const keys = (arr) => arr;
    if (this.t >= 25 && !this._aiGo) {
      this._aiGo = true;
      this.issue(1, keys(['L', 'C', 'R']), 'advance'); this.issue(1, keys(['A', 'K']), 'advance');
      this.aiLog.push([this.t, 'advance main body']);
    }
    const v = this.groups.find(g => g.team === 1 && g.key === 'V');
    if (v && v.alive > 0 && !this._aiCharge) {
      let close = false;
      for (const g of this.groups) if (g.team === 0 && g.alive > 0 && Math.hypot(g.cx - v.cx, g.cy - v.cy) < 380) close = true;
      if (close || this.t > 90) { this._aiCharge = true; this.issue(1, ['V'], 'advance'); this.aiLog.push([this.t, 'reserve charges']); }
    }
  }
  step() {
    const dt = DT;
    this.t += dt; this.stepN++;
    while (this.orders.length && this.orders[0].at <= this.t) this.exec(this.orders.shift());
    this.rebuildGrid();
    const { x, y, vx, vy, ox, oy, team, type, grp, alive, near, head, nxt, groups, rng, N } = this;
    for (let i = 0; i < N; i++) {
      if (!alive[i]) continue;
      const g = groups[grp[i]];
      const resist = (g.train - 1) / 9;
      const morale = g.morale;
      let sp = g.speed * (1 + 0.02 * (g.train - 1)) * (0.5 + 0.5 * morale) * this.terrain(x[i], y[i]);
      if (type[i] === CAV) sp = g.speed * (1 + 0.02 * (g.train - 1)) * (0.5 + 0.5 * morale) * this.terrain(x[i], y[i]);
      if (g.fleeing) sp *= 1.25;
      let tx = g.goal.x + ox[i], ty = g.goal.y + oy[i];
      let seek = false;
      const aggroR = g.fleeing ? 0 : (g.stance === 'advance' ? 14 : g.stance === 'move' || g.stance === 'flank' ? 8 : g.stance === 'hold' ? 5 : 0);
      const ni = near[i];
      if (ni >= 0 && alive[ni] && !g.ranged && aggroR > 0) {
        const dx = x[ni] - x[i], dy = y[ni] - y[i];
        if (dx * dx + dy * dy < aggroR * aggroR) { tx = x[ni]; ty = y[ni]; seek = true; }
      }
      let dx = tx - x[i], dy = ty - y[i];
      const d = Math.hypot(dx, dy);
      let dvx = 0, dvy = 0;
      if (d > (seek ? 1.4 : 1.0)) { const s = (seek ? sp * 1.15 : sp); dvx = dx / d * s; dvy = dy / d * s; }
      const cs = 0.3 + 0.7 * morale;
      const noise = ((1 - cs) * 1.2 + (1 - resist) * 0.25) * 0.8;
      dvx += (rng() - 0.5) * noise; dvy += (rng() - 0.5) * noise;
      // separation
      const cxi = clamp((x[i] / CELL) | 0, 0, GX - 1), cyi = clamp((y[i] / CELL) | 0, 0, GY - 1);
      let sxp = 0, syp = 0;
      for (let cy = Math.max(0, cyi - 1); cy <= Math.min(GY - 1, cyi + 1); cy++) {
        for (let cx = Math.max(0, cxi - 1); cx <= Math.min(GX - 1, cxi + 1); cx++) {
          for (let j = head[cy * GX + cx]; j >= 0; j = nxt[j]) {
            if (j === i) continue;
            const ex = x[i] - x[j], ey = y[i] - y[j], e2 = ex * ex + ey * ey;

  // Head-on: 200 spearmen (team 0) hold against 200 cavalry charging (team 1).

        block(1, 'V', CAV, 200, 1700, 800, 60, 60, 1),

        { team: 0, key: 'T', name: 'T', train: 9, count: 160, cx: 1000, cy: 880, w: 60, h: 100, type: SOL },

}

    const keys = []; for (const [k, re] of GROUP_WORDS) if (re.test(c)) keys.push(k);
    if (/\b(all|army|everyone|everybody|troops|men)\b/.test(c)) keys.length = 0, keys.push('all');
    let act = null; for (const [a, re] of ACTIONS) if (re.test(c)) { act = a; break; }
    if (!act) { if (keys.length) last = keys; continue; }
    const ks = keys.length ? keys : last || ['all'];
    orders.push({ keys: ks.includes('all') ? 'all' : ks, action: act }); last = ks;
  }
  return { orders, mood };
}
function describe(o) { return `${o.action} ${o.keys === 'all' ? 'whole army' : o.keys.map(k => GROUP_KEYS.find(g => g[0] === k)[1]).join(' + ')}`; }
function send(text) {
  if (!sim || sim.over) return;
  const p = parseCommand(text);
  if (!p.orders.length) { log('Not understood: ' + text + ' (stand-in parser; the real game asks before acting)'); return; }
  log('Understood: ' + p.orders.map(describe).join('; ') + (Math.abs(p.mood) > .05 ? `; mood ${p.mood > 0 ? 'heroic' : 'harsh'}` : ''));
  p.orders.forEach((o, i) => sim.issue(0, o.keys, o.action, i === 0 ? { mood: p.mood } : {}));
}

/* ---- buttons ---- */
function renderGroupBtns() {
  const box = $('grpBtns'); box.textContent = '';
  for (const [k, name] of GROUP_KEYS) {
    const b = document.createElement('button'); b.textContent = name; b.setAttribute('aria-pressed', selected.has(k));
    b.onclick = () => { selected.has(k) ? selected.delete(k) : selected.add(k); renderGroupBtns(); };
    box.appendChild(b);
  }
  const act = $('actBtns'); act.textContent = '';
  for (const [a, label] of [['advance', 'Advance'], ['hold', 'Hold'], ['retreat', 'Retreat'], ['flank', 'Flank'], ['conceal', 'Hide in trees']]) {
    const b = document.createElement('button'); b.textContent = label;
    b.onclick = () => { if (!sim || sim.over) return; const keys = selected.size ? [...selected] : 'all'; sim.issue(0, keys, a); log('Ordered: ' + a + ' ' + (keys === 'all' ? 'whole army' : keys.join('+'))); };
    act.appendChild(b);
  }
}
$('cmd').addEventListener('submit', (e) => { e.preventDefault(); const v = $('cmdIn').value.trim(); if (v) { send(v); $('cmdIn').value = ''; } });
document.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => {
  speed = parseInt(b.dataset.sp, 10); document.querySelectorAll('[data-sp]').forEach(x => x.setAttribute('aria-pressed', x === b));
});
$('optReset').onclick = newBattle; $('bRe').onclick = newBattle;
$('optDebug').onchange = (e) => { debugOrders = e.target.checked; };
$('optHide').onchange = (e) => { if (sim) sim.hideEnemy = e.target.checked; };

/* ---- touch: one finger pans, two fingers swipe to order or pinch to zoom ---- */
const touches = new Map(); let two = null;
cv.addEventListener('pointerdown', (e) => {
  cv.setPointerCapture(e.pointerId); touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { const [a, b] = [...touches.values()]; two = { mx0: (a.x + b.x) / 2, my0: (a.y + b.y) / 2, d0: Math.hypot(a.x - b.x, a.y - b.y), box: [Math.min(a.x, b.x), Math.min(a.y, b.y), Math.max(a.x, b.x), Math.max(a.y, b.y)], mx: 0, my: 0, d: 0, lastD: 0, zoomed: false }; two.mx = two.mx0; two.my = two.my0; two.d = two.d0; two.lastD = two.d0; }
});
cv.addEventListener('pointermove', (e) => {
  const p = touches.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (touches.size === 1) { cam.x -= dx / cam.s; cam.y -= dy / cam.s; clampCam(); }
  else if (touches.size === 2 && two) {
    const [a, b] = [...touches.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
    two.mx = (a.x + b.x) / 2; two.my = (a.y + b.y) / 2; two.d = d;
    two.box = [Math.min(two.box[0], a.x, b.x), Math.min(two.box[1], a.y, b.y), Math.max(two.box[2], a.x, b.x), Math.max(two.box[3], a.y, b.y)];
    const ratio = d / two.d0;
    if (Math.abs(ratio - 1) > 0.18 || two.zoomed) {   // pinch: live zoom around the midpoint
      two.zoomed = true; const f = d / two.lastD; const wx = cam.x + two.mx / cam.s, wy = cam.y + two.my / cam.s;
      cam.s *= f; clampCam(); cam.x = wx - two.mx / cam.s; cam.y = wy - two.my / cam.s; clampCam();
    }
    two.lastD = d;
  }
});
function endPointer(e) {
  if (touches.size === 2 && two && !two.zoomed) {
    const dx = two.mx - two.mx0, dy = two.my - two.my0, len = Math.hypot(dx, dy);
    if (len > 40 && sim && !sim.over) swipeOrder(dx / len, dy / len);
  }
  touches.delete(e.pointerId); if (touches.size < 2) two = null;
}
cv.addEventListener('pointerup', endPointer); cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', (e) => {
  e.preventDefault(); const wx = cam.x + e.offsetX / cam.s, wy = cam.y + e.offsetY / cam.s;
  cam.s *= Math.exp(-e.deltaY * 0.0015); clampCam(); cam.x = wx - e.offsetX / cam.s; cam.y = wy - e.offsetY / cam.s; clampCam();
}, { passive: false });
function swipeOrder(ux, uy) {
  // groups whose centre lies in the swiped area; none means the whole army (spec 7.2)
  const r = cv.getBoundingClientRect(), m = 60;
  const x0 = cam.x + (two.box[0] - r.left - m) / cam.s, x1 = cam.x + (two.box[2] - r.left + m) / cam.s;
  const y0 = cam.y + (two.box[1] - r.top - m) / cam.s, y1 = cam.y + (two.box[3] - r.top + m) / cam.s;
  const keys = sim.groups.filter(g => g.team === 0 && g.alive > 0 && g.cx >= x0 && g.cx <= x1 && g.cy >= y0 && g.cy <= y1).map(g => g.key);
  const target = keys.length ? keys : 'all';
  if (Math.abs(ux) > Math.abs(uy) * 1.4) {
    const act = ux > 0 ? 'advance' : 'retreat';
    sim.issue(0, target, act); log(`Swipe: ${act} ${target === 'all' ? 'whole army' : target.join('+')}`);
  } else {
    sim.issue(0, target, 'move', { dx: ux, dy: uy }); log(`Swipe: move ${target === 'all' ? 'whole army' : target.join('+')}`);
  }
}

/* ---- main loop ---- */
let last = performance.now(), acc = 0, fpsN = 0, fpsT = 0, msEma = 0, uiT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (sim && !sim.over) {
    acc += dt * speed; let steps = 0; const t0 = performance.now();
    while (acc >= DT && steps < 12) { sim.step(); acc -= DT; steps++; }
    if (acc > DT * 12) acc = 0;
    if (steps) msEma = msEma * 0.9 + ((performance.now() - t0) / steps) * 0.1;
  }
  if (sim) draw();
  fpsN++; fpsT += dt; uiT += dt;
  if (uiT > 0.5 && sim) {
    $('sFps').textContent = Math.round(fpsN / fpsT); fpsN = 0; fpsT = 0; uiT = 0;
    $('sMs').textContent = msEma.toFixed(1); $('sT').textContent = Math.round(sim.t);
    $('sY').textContent = sim.count[0]; $('sF').textContent = sim.count[1];
    if (sim.over && !$('banner').classList.contains('show')) {
      $('bT').textContent = sim.over.winner === 0 ? 'Victory' : 'Defeat';
      $('bP').textContent = `After ${Math.round(sim.over.t)} s. You lost ${sim.start[0] - sim.count[0]} of ${sim.start[0]}; the enemy lost ${sim.start[1] - sim.count[1]} of ${sim.start[1]}.`;
      $('banner').classList.add('show');
    }
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readPalette);
new MutationObserver(readPalette).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
readPalette(); resize(); renderGroupBtns(); newBattle();
requestAnimationFrame(frame);
})();
</script>
